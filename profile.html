<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - HEARTBROKENSKINS</title>
    <link rel="icon" type="image/png" href="assets/logo1.png">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="site-wrapper">
        <!-- Header -->
        <header class="site-header">
            <nav class="nav-container">
                <div class="nav-logo">
                    <a href="index.html">
                        <img src="assets/logo1.png" alt="Logo" style="height: 40px;">
                    </a>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#mods">Mods</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
                <div class="nav-actions">
                    <button id="loginBtn" class="login-btn" onclick="window.location.href='login.html'">Login</button>
                    <div id="userProfile" class="user-profile" style="display: none;">
                        <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
                        <span id="userName" class="user-name"></span>
                    </div>
                    <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
                </div>
            </nav>
        </header>

        <main class="main-content" style="padding: 4rem 2rem; min-height: calc(100vh - 200px);">
            <div style="max-width: 1200px; margin: 0 auto;">
                <!-- Profile Header -->
                <div style="background: rgba(18, 18, 18, 0.6); border: 1px solid rgba(255, 0, 0, 0.2); border-radius: 15px; padding: 3rem; margin-bottom: 2rem; position: relative; overflow: hidden;">
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 150px; background: linear-gradient(135deg, rgba(255, 0, 0, 0.1) 0%, rgba(139, 0, 0, 0.1) 100%); z-index: 0;"></div>
                    
                    <div style="position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 2rem;">
                        <img id="profileAvatar" src="" alt="Profile Avatar" style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255, 0, 0, 0.5); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);">
                        
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                                <h1 id="profileUsername" style="font-size: 2.5rem; color: #fff; font-weight: 700;"></h1>
                                <span id="adminBadge" style="display: none; padding: 0.4rem 1rem; background: rgba(255, 0, 0, 0.2); color: #ff0000; border-radius: 6px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255, 0, 0, 0.4);">ADMIN</span>
                            </div>
                            <p id="profileBio" style="color: rgba(255, 255, 255, 0.6); font-size: 1.1rem;">League of Legends skin creator</p>
                            
                            <div style="display: flex; gap: 2rem; margin-top: 1.5rem;">
                                <div>
                                    <div style="font-size: 1.5rem; font-weight: 700; color: #fff;">0</div>
                                    <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.5);">Uploads</div>
                                </div>
                                <div>
                                    <div style="font-size: 1.5rem; font-weight: 700; color: #fff;">0</div>
                                    <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.5);">Downloads</div>
                                </div>
                                <div>
                                    <div style="font-size: 1.5rem; font-weight: 700; color: #fff;">0</div>
                                    <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.5);">Followers</div>
                                </div>
                            </div>
                        </div>
                        
                        <button id="editProfileBtn" style="display: none; padding: 0.75rem 2rem; background: rgba(255, 0, 0, 0.1); color: #ff0000; border: 1px solid rgba(255, 0, 0, 0.3); border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255, 0, 0, 0.2)'" onmouseout="this.style.background='rgba(255, 0, 0, 0.1)'">
                            Edit Profile
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid rgba(255, 0, 0, 0.2);">
                    <button class="profile-tab active" data-tab="uploads" style="padding: 1rem 2rem; background: none; border: none; color: rgba(255, 255, 255, 0.6); font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s ease;">
                        Uploads
                    </button>
                    <button class="profile-tab" data-tab="favorites" style="padding: 1rem 2rem; background: none; border: none; color: rgba(255, 255, 255, 0.6); font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s ease;">
                        Favorites
                    </button>
                </div>

                <!-- Content -->
                <div id="uploadsTab" class="tab-content">
                    <div style="background: rgba(18, 18, 18, 0.6); border: 1px solid rgba(255, 0, 0, 0.2); border-radius: 15px; padding: 3rem; text-align: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" style="margin: 0 auto 1rem;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p style="color: rgba(255, 255, 255, 0.6); font-size: 1.1rem;">No uploads yet</p>
                    </div>
                </div>

                <div id="favoritesTab" class="tab-content" style="display: none;">
                    <div style="background: rgba(18, 18, 18, 0.6); border: 1px solid rgba(255, 0, 0, 0.2); border-radius: 15px; padding: 3rem; text-align: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" style="margin: 0 auto 1rem;">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <p style="color: rgba(255, 255, 255, 0.6); font-size: 1.1rem;">No favorites yet</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; 2025 HEARTBROKENSKINS. All rights reserved.</p>
        </footer>
    </div>

    <script src="scripts/auth-handler.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.profile-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');
                
                // Update active tab
                document.querySelectorAll('.profile-tab').forEach(t => {
                    t.classList.remove('active');
                    t.style.color = 'rgba(255, 255, 255, 0.6)';
                    t.style.borderBottomColor = 'transparent';
                });
                tab.classList.add('active');
                tab.style.color = '#ff0000';
                tab.style.borderBottomColor = '#ff0000';
                
                // Show corresponding content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = 'none';
                });
                document.getElementById(tabName + 'Tab').style.display = 'block';
            });
        });

        // Set active tab styling
        document.querySelector('.profile-tab.active').style.color = '#ff0000';
        document.querySelector('.profile-tab.active').style.borderBottomColor = '#ff0000';

        // Load profile data
        const API_URL = 'https://heartbrokenskins-logging.up.railway.app';
        
        async function loadProfile() {
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                // Show logged out state
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    
                    // Update profile info
                    document.getElementById('profileAvatar').src = user.avatar || 'assets/default-avatar.png';
                    document.getElementById('profileUsername').textContent = user.username || 'User';
                    
                    if (user.isAdmin) {
                        document.getElementById('adminBadge').style.display = 'inline-block';
                    }
                    
                    // Show edit button if viewing own profile
                    document.getElementById('editProfileBtn').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        loadProfile();
    </script>
</body>
</html>
