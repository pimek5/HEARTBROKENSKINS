    <script>
        // Dropdown toggles
        const sortButton = document.getElementById('sortButton');
        const sortDropdown = document.getElementById('sort-dropdown');
        const sizeButton = document.getElementById('sizeButton');
        const sizeDropdown = document.getElementById('size-dropdown');
        
        // Toggle sort dropdown
        sortButton?.addEventListener('click', (e) => {
            e.stopPropagation();
            sortDropdown.classList.toggle('hidden');
            sizeDropdown.classList.add('hidden');
        });
        
        // Toggle size dropdown
        sizeButton?.addEventListener('click', (e) => {
            e.stopPropagation();
            sizeDropdown.classList.toggle('hidden');
            sortDropdown.classList.add('hidden');
        });
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', () => {
            sortDropdown?.classList.add('hidden');
            sizeDropdown?.classList.add('hidden');
        });
        
        // Sort option selection
        document.querySelectorAll('.sort-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = option.dataset.value;
                const label = option.textContent;
                
                // Update button label
                document.getElementById('sortLabel').textContent = label;
                
                // Update active state
                document.querySelectorAll('.sort-option').forEach(opt => {
                    opt.classList.remove('text-[#ff0000]', 'bg-[#121212]');
                    opt.classList.add('text-[#999]');
                });
                option.classList.remove('text-[#999]');
                option.classList.add('text-[#ff0000]', 'bg-[#121212]');
                
                // Close dropdown
                sortDropdown.classList.add('hidden');
                
                // Trigger sort (to be implemented in mods.js)
                console.log('Sort by:', value);
            });
        });
        
        // Size option selection
        document.querySelectorAll('.size-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = option.dataset.value;
                
                // Update button label
                document.getElementById('sizeLabel').textContent = `View: ${value}`;
                
                // Update active state
                document.querySelectorAll('.size-option').forEach(opt => {
                    opt.classList.remove('text-[#ff0000]', 'bg-[#121212]');
                    opt.classList.add('text-[#999]');
                });
                option.classList.remove('text-[#999]');
                option.classList.add('text-[#ff0000]', 'bg-[#121212]');
                
                // Close dropdown
                sizeDropdown.classList.add('hidden');
                
                // Trigger page size change (to be implemented in mods.js)
                console.log('View size:', value);
            });
        });
        
        // Free/Paid filter toggles
        const freeOnlyBtn = document.getElementById('freeOnlyBtn');
        const paidOnlyBtn = document.getElementById('paidOnlyBtn');
        
        let freeOnlyActive = false;
        let paidOnlyActive = false;
        
        freeOnlyBtn?.addEventListener('click', () => {
            freeOnlyActive = !freeOnlyActive;
            
            const checkbox = freeOnlyBtn.querySelector('div');
            if (freeOnlyActive) {
                checkbox.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                checkbox.classList.add('border-[#ff0000]');
                freeOnlyBtn.classList.add('border-[#ff0000]', 'text-white');
                freeOnlyBtn.classList.remove('text-[#999]');
            } else {
                checkbox.innerHTML = '';
                checkbox.classList.remove('border-[#ff0000]');
                freeOnlyBtn.classList.remove('border-[#ff0000]', 'text-white');
                freeOnlyBtn.classList.add('text-[#999]');
            }
            
            console.log('Free only:', freeOnlyActive);
        });
        
        paidOnlyBtn?.addEventListener('click', () => {
            paidOnlyActive = !paidOnlyActive;
            
            const checkbox = paidOnlyBtn.querySelector('div');
            if (paidOnlyActive) {
                checkbox.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                checkbox.classList.add('border-[#ff0000]');
                paidOnlyBtn.classList.add('border-[#ff0000]', 'text-white');
                paidOnlyBtn.classList.remove('text-[#999]');
            } else {
                checkbox.innerHTML = '';
                checkbox.classList.remove('border-[#ff0000]');
                paidOnlyBtn.classList.remove('border-[#ff0000]', 'text-white');
                paidOnlyBtn.classList.add('text-[#999]');
            }
            
            console.log('Paid only:', paidOnlyActive);
        });
        
        // Grid/List view toggle
        const gridViewBtn = document.getElementById('gridViewBtn');
        const listViewBtn = document.getElementById('listViewBtn');
        
        gridViewBtn?.addEventListener('click', () => {
            gridViewBtn.classList.add('bg-[#121212]', 'text-[#ff0000]');
            gridViewBtn.classList.remove('text-[#999]');
            listViewBtn.classList.remove('bg-[#121212]', 'text-[#ff0000]');
            listViewBtn.classList.add('text-[#999]');
            
            console.log('Grid view');
        });
        
        listViewBtn?.addEventListener('click', () => {
            listViewBtn.classList.add('bg-[#121212]', 'text-[#ff0000]');
            listViewBtn.classList.remove('text-[#999]');
            gridViewBtn.classList.remove('bg-[#121212]', 'text-[#ff0000]');
            gridViewBtn.classList.add('text-[#999]');
            
            console.log('List view');
        });
    </script>
