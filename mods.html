        <main class="main-content">
            <div class="mods-layout">
                <aside class="sidebar">
                    <div class="filter-section">
                        <div class="search-section">
                            <input type="text" id="modSearch" placeholder="Search mods...">
                            <div class="total-mods">Total mods: <span id="modsCount">0</span></div>
                        </div>
                        <div class="filters-container">
                            <div class="filter-category">
                                <div class="filter-header" data-category="gilded">
                                    <span>Gilded</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                            </div>
                            <div class="filter-category">
                                <div class="filter-header" data-category="champions">
                                    <span>Champions</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                                <div class="champions-filter">
                                    <div class="search-container">
                                        <input type="text" id="championSearch" placeholder="Search champions...">
                                    </div>
                                    <div class="champions-list scrollbar-custom" id="championsList">
                                        <!-- Champions will be loaded dynamically -->
                                    </div>
                                </div>
                            </div>
                            <div class="filter-category">
                                <div class="filter-header" data-category="maps">
                                    <span>Maps</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                            </div>
                            <div class="filter-category">
                                <div class="filter-header" data-category="categories">
                                    <span>Categories</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                                <div class="checkbox-group">
                                    <label><input type="checkbox" value="skins"> Skins</label>
                                    <label><input type="checkbox" value="chromas"> Chromas</label>
                                    <label><input type="checkbox" value="ward-skins"> Ward Skins</label>
                                    <label><input type="checkbox" value="emotes"> Emotes</label>
                                </div>
                            </div>
                            <div class="filter-category">
                                <div class="filter-header" data-category="themes">
                                    <span>Themes</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                                <div class="checkbox-group">
                                    <label><input type="checkbox" value="anime"> Anime</label>
                                    <label><input type="checkbox" value="fantasy"> Fantasy</label>
                                    <label><input type="checkbox" value="gaming"> Gaming</label>
                                    <label><input type="checkbox" value="events"> Events</label>
                                </div>
                            </div>
                            <div class="filter-category">
                                <div class="filter-header" data-category="features">
                                    <span>Features</span>
                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <section class="mods-content">
                    <div class="mods-header">
                        <div class="mods-controls">
                            <div class="size-control">
                                <span>Size:</span>
                                <select id="pageSize">
                                    <option value="24">24</option>
                                    <option value="48">48</option>
                                    <option value="96">96</option>
                                </select>
                            </div>
                            <div class="showing-total">
                                Showing: <span id="currentlyShowing">0</span>
                            </div>
                            <div class="sort-control">
                                <span>Sort by:</span>
                                <select id="sortSelect">
                                    <option value="recently-updated">Recently updated</option>
                                    <option value="most-downloaded">Most downloaded</option>
                                    <option value="most-viewed">Most viewed</option>
                                    <option value="highest-rated">Highest rated</option>
                                </select>
                            </div>
                        </div>
                        <div class="view-controls">
                            <button class="view-grid active" title="Grid view">
                                <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
                            </button>
                            <button class="view-list" title="List view">
                                <svg viewBox="0 0 24 24"><path d="M3 4h18v2H3zM3 11h18v2H3zM3 18h18v2H3z"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mods-grid" id="modsGrid">
                        <!-- Mods will be loaded dynamically -->
                    </div>

                    <div class="pagination">
                        <button class="prev-page" disabled>Previous</button>
                        <div class="page-numbers" id="pageNumbers">
                            <!-- Page numbers will be generated dynamically -->
                        </div>
                        <button class="next-page">Next</button>
                    </div>
                </section>
